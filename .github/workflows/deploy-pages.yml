name: Deploy Teaching Website & Blog To GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "claude_code_teaching_website.html"
      - "interactive.html"
      - "tutorial.v4.js"
      - "image/**"
      - "blog/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          # 教學網站（講義型）部署到根目錄為 index.html，並保留原檔名作為別名以相容本地連結
          cp claude_code_teaching_website.html _site/index.html
          cp claude_code_teaching_website.html _site/claude_code_teaching_website.html
          # 互動體驗版部署為 /interactive.html，與其相依的 tutorial.v4.js
          if [ -f interactive.html ]; then
            cp interactive.html _site/interactive.html
          fi
          if [ -f tutorial.v4.js ]; then
            cp tutorial.v4.js _site/tutorial.v4.js
          fi
          # 教學圖片（兩個 HTML 共用同一份 image/）
          if [ -d image ]; then
            cp -r image _site/image
          fi
          # Blog 部署到 /blog/ 子目錄（保留原有內容）
          if [ -d blog ]; then
            cp -r blog _site/blog
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
