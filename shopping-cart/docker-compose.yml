services:
  postgres:
    image: postgres:16-alpine
    container_name: shopcart-db
    environment:
      POSTGRES_DB: shopcart
      POSTGRES_USER: shopcart
      POSTGRES_PASSWORD: shopcart
    ports:
      - "5432:5432"
    volumes:
      - ./src/server/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - shopcart-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopcart -d shopcart"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  shopcart-data:
